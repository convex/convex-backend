name: Release Self-Hosted Images

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  release_backend:
    uses: ./.github/workflows/release_local_backend.yml
    permissions:
      contents: read
      packages: write
      id-token: write

  release_dashboard:
    uses: ./.github/workflows/release_local_dashboard.yml
    permissions:
      contents: read
      packages: write
      id-token: write

  test_backend:
    needs: release_backend
    uses: ./.github/workflows/test_self_hosted_backend.yml
    with:
      image_digest_x64: ${{ needs.release_backend.outputs.backend_x64_digest }}
      image_digest_arm64:
        ${{ needs.release_backend.outputs.backend_arm64_digest }}

  tag_images:
    needs: [release_backend, release_dashboard, test_backend]
    # Only run this job if the tests passed
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend manifest
        run: |
          docker manifest create ghcr.io/convex/convex-backend:${{ github.sha }} \
            --amend ghcr.io/convex/convex-backend@${{ needs.release_backend.outputs.backend_x64_digest }} \
            --amend ghcr.io/convex/convex-backend@${{ needs.release_backend.outputs.backend_arm64_digest }}
          docker manifest push ghcr.io/convex/convex-backend:${{ github.sha }}

      - name: Tag and push dashboard manifest
        run: |
          docker manifest create ghcr.io/convex/convex-dashboard:${{ github.sha }} \
            --amend ghcr.io/convex/convex-dashboard@${{ needs.release_dashboard.outputs.dashboard_x64_digest }} \
            --amend ghcr.io/convex/convex-dashboard@${{ needs.release_dashboard.outputs.dashboard_arm64_digest }}
          docker manifest push ghcr.io/convex/convex-dashboard:${{ github.sha }}
