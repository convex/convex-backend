name: Test Self-Hosted Backend

on:
  workflow_call:
    inputs:
      image_digest_x64:
        description: "x64 image digest to test"
        type: string
        required: true
      image_digest_arm64:
        description: "arm64 image digest to test"
        type: string
        required: true

jobs:
  test_self_hosted_backend:
    name: Test self-hosted backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      backend:
        image: ghcr.io/convex/convex-backend@${{ inputs.image_digest_x64 }}
        env:
          V8_ACTION_USER_TIMEOUT_SECS: "20"
          NODE_ACTION_USER_TIMEOUT_SECS: "20"
          CONVEX_CLOUD_ORIGIN: "http://127.0.0.1:3210"
          CONVEX_SITE_ORIGIN: "http://127.0.0.1:3211"
          DISABLE_BEACON: "true"
        ports:
          - "3210:3210" # Backend API
          - "3211:3211" # Site proxy
        options: >-
          --health-cmd "curl -f http://localhost:3210/version" --health-interval
          10s --health-timeout 5s --health-retries 5 --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Restore-only: OSS can't write this cache (cache-write role is convex/convex-only).
      - name: Restore pnpm artifacts
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUNS_ON_S3_BUCKET_CACHE: ${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
        with:
          path: |
            ~/.local/share/pnpm/store
            npm-packages/.turbo/cache
          key: pnpm-cache-${{ hashFiles('npm-packages/pnpm-lock.yaml') }}-3
          restore-keys: pnpm-cache-

      - name: Install mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: NPM install globals
        run: npm ci --prefix scripts

      - name: Build NPM Packages
        run: |
          just install-js
          just turbo run build --filter=test-project...

      - name: Try pushing to the deployment
        working-directory: npm-packages/private-demos/test-project
        run: |
          ADMIN_KEY=$(docker exec ${{ job.services.backend.id }} ./generate_admin_key.sh)
          echo "Pushing functions... "
          npx convex deploy --url http://127.0.0.1:3210 --admin-key $ADMIN_KEY

      - name: Verify that the deployment has been pushed to
        working-directory: npm-packages/private-demos/test-project
        run: test "$(curl -fsS http://127.0.0.1:3211)" = "Hello world!"
