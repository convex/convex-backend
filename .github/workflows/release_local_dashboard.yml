name: Release Self-Hosted Dashboard

on:
  workflow_call:
    outputs:
      dashboard_x64_digest:
        description: "x64 image digest"
        value: ${{ fromJson(jobs.read.outputs.result).digest.dashboard-x64 }}
      dashboard_arm64_digest:
        description: "arm64 image digest"
        value: ${{ fromJson(jobs.read.outputs.result).digest.dashboard-arm64 }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build dashboard image
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: [self-hosted, aws, "${{ matrix.arch }}", xlarge]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: self-hosted/docker-build/Dockerfile.dashboard
          tags: |
            ghcr.io/convex/convex-dashboard
          # This workflow does not use a build cache.
          # A shared cache is not safe for a release build. A bad cache entry
          # from a cache poisoning attack can put incorrect content into the
          # image.
          # A build without a cache is slower, but the speed is not a problem
          # here. This workflow runs only when a change merges to the `release`
          # branch.
          no-cache: true
          outputs: push-by-digest=true,type=image,push=true
          provenance: false

      - name: Write digest
        uses: cloudposse/github-action-matrix-outputs-write@ed06cf3a6bf23b8dce36d1cf0d63123885bb8375 # v1
        id: digest
        with:
          matrix-step-name: ${{ github.job }}
          matrix-key: dashboard-${{ matrix.arch }}
          outputs: |-
            digest: ${{ steps.build-image.outputs.digest }}

  read:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: cloudposse/github-action-matrix-outputs-read@33cac12fa9282a7230a418d859b93fdbc4f27b5a # v1
        id: read
        with:
          matrix-step-name: build
    outputs:
      result: "${{ steps.read.outputs.result }}"
