name: Precompile Local Backend

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release_metadata:
    name: Select release name
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_name.outputs.release_name }}
    steps:
      - name: Select release name
        id: release_name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Reruns retain their run ID, so this date is stable across workflow attempts.
          release_date=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.created_at[0:10]')
          echo "release_name=$release_date-${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"

  release_backend:
    needs: release_metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: "['self-hosted', 'aws', 'x64', 'xlarge']"
            container: public.ecr.aws/docker/library/ubuntu:22.04
          - target: aarch64-unknown-linux-gnu
            # xlarge-c8g: precompiled binaries run on arbitrary user hardware,
            # so build on the oldest-generation arm64 pool.
            os: "['self-hosted', 'aws', 'arm64', 'xlarge-c8g']"
            container: public.ecr.aws/docker/library/ubuntu:22.04
    name: Build Convex Backend
    runs-on: ${{ fromJSON(matrix.os) }}
    # Linux binaries run on arbitrary user machines, and glibc is only
    # backwards-compatible, so build them against an older distro than the
    # runner image: Ubuntu 22.04 (glibc 2.35, libstdc++ GLIBCXX_3.4.30).
    # The container can't reach the instance profile, so it skips the in-VPC
    # S3 caches (see setup-rust's in-vpc-cache).
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install build dependencies (container)
        if: matrix.container
        shell: bash
        run: |
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates cmake curl g++-12 gcc-12 \
            git libclang-dev libsnappy-dev libsodium-dev libssl-dev pkg-config \
            python3 sudo unzip xz-utils zip
          # ada-url needs C++20 support beyond jammy's default gcc 11.
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rusty_v8 contains deeply nested Chromium sources that exceed MAX_PATH
      # under the default user-profile Cargo directory.
      - name: Use short CARGO_HOME on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_HOME=C:\c' >> "$GITHUB_ENV"

      # Windows-only: Defender's real-time scan of every small file dominates the
      # cargo/JS build wall-clock. Exclude the file-heavy dirs (best-effort).
      - name: Exclude build dirs from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in @(
            "${{ github.workspace }}",
            "$env:LOCALAPPDATA\pnpm",
            "$env:CARGO_HOME"
          )) { Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue }
          Add-MpPreference -ExclusionProcess node.exe -ErrorAction SilentlyContinue

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          r2-access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          in-vpc-cache: ${{ !matrix.container }}

      # Restore-only: OSS can't write this cache (cache-write role is convex/convex-only).
      - name: Restore pnpm artifacts
        if: ${{ !matrix.container }}
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUNS_ON_S3_BUCKET_CACHE: ${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
        with:
          path: |
            ~/.local/share/pnpm/store
            ~\AppData\Local\pnpm\store
            npm-packages/.turbo/cache
          key: pnpm-cache-${{ hashFiles('npm-packages/pnpm-lock.yaml') }}-3
          restore-keys: pnpm-cache-

      - name: Install mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: NPM install globals
        run: npm ci --prefix scripts

      # pnpm only defaults to this store path when the workspace shares a drive
      # with $HOME; Windows runners check out on another drive, where the
      # default would miss the cache path above.
      - name: Pin pnpm store to the cached path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run:
          echo "npm_config_store_dir=$LOCALAPPDATA/pnpm/store" >> "$GITHUB_ENV"

      - name: Install JS
        shell: bash
        run: |
          just install-js

      - name: Precompute artifact names
        id: artifact_names
        shell: bash
        run: |
          ZIP_NAME=convex-local-backend-${{ matrix.target }}.zip
          BINARY_NAME=convex-local-backend${{ runner.os == 'Windows' && '.exe' || '' }}
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_OUTPUT

      - name: Build backend
        shell: bash
        run: |
          set -ex
          unset ROCKSDB_LIB_DIR
          unset SODIUM_USE_PKG_CONFIG
          unset SNAPPY_LIB_DIR
          export AWS_LC_SYS_PREBUILT_NASM=1
          # Ninja avoids cmake-rs's MSVC-generator autodetect, which panics
          # building aws-lc-sys on windows-latest's VS2026 (aws/aws-lc-rs#780).
          if [ "$RUNNER_OS" = "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
          cargo build --release -p local_backend --bin convex-local-backend
          mv target/release/${{ steps.artifact_names.outputs.BINARY_NAME }} .

      - name: Check glibc and libstdc++ symbol versions
        if: runner.os == 'Linux'
        shell: bash
        env:
          BINARY_NAME: ${{ steps.artifact_names.outputs.BINARY_NAME }}
        run: |
          set -euo pipefail
          check() {
            local prefix=$1 max=$2 newest
            newest=$(objdump -T "$BINARY_NAME" | grep -o "${prefix}_[0-9.]*" |
              sed "s/^${prefix}_//" | sort -uV | tail -1)
            echo "newest ${prefix} symbol version: ${newest}"
            if [ "$(printf '%s\n%s\n' "$newest" "$max" | sort -V | tail -1)" != "$max" ]; then
              echo "::error::$BINARY_NAME needs ${prefix}_${newest}, newer than ${prefix}_${max}"
              exit 1
            fi
          }
          check GLIBC 2.35
          check GLIBCXX 3.4.30
