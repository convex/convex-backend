name: Release Self-Hosted Backend

on:
  workflow_call:
    outputs:
      backend_x64_digest:
        description: "x64 image digest"
        value: ${{ jobs.build.outputs.x64_digest }}
      backend_arm64_digest:
        description: "arm64 image digest"
        value: ${{ jobs.build.outputs.arm64_digest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build backend image
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: [self-hosted, aws, "${{ matrix.arch }}", xlarge]
    # Each leg sets only its own arch's key, and GitHub merges the legs' outputs.
    outputs:
      x64_digest: ${{ steps.digest.outputs.x64_digest }}
      arm64_digest: ${{ steps.digest.outputs.arm64_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get UTC ISO8601 timestamp
        run:
          echo "COMMIT_TIMESTAMP=$(git log -1 --format='%aI' | date -f - --utc
          '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: self-hosted/docker-build/Dockerfile.backend
          tags: |
            ghcr.io/convex/convex-backend
          # This workflow does not use a build cache.
          # A shared cache is not safe for a release build. A bad cache entry
          # from a cache poisoning attack can put incorrect content into the
          # image.
          # A build without a cache is slower, but the speed is not a problem
          # here. This workflow runs only when a change merges to the `release`
          # branch.
          no-cache: true
          outputs: push-by-digest=true,type=image,push=true
          provenance: false
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_COMMIT_TIMESTAMP=${{ env.COMMIT_TIMESTAMP }}

      - name: Write digest
        id: digest
        env:
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: echo "${{ matrix.arch }}_digest=$DIGEST" >> "$GITHUB_OUTPUT"
