[profile.release]
opt-level = 3
overflow-checks = true
panic = "abort"

[profile.slim-release]
inherits = "release"
strip = "debuginfo"

[patch.crates-io]
v8 = { git = "https://github.com/convex/rusty_v8", rev = "105b32c50433c4cf6eb77fe6a79e93b8637b20e2" }
prometheus = { git = "https://github.com/convex/rust-prometheus", rev = "367f80d0d3678ed7989814fd5864598746a3b946" }
