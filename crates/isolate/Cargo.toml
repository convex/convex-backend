[package]
name = "isolate"
version = "0.1.0"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

build = "build.rs"
include = ["data"]

[package.metadata.cargo-machete]
ignored = ["js_build", "phf", "sha2", "walkdir"]

[lib]
doctest = false

[features]
testing = [
    "common/testing",
    "database/testing",
    "errors/testing",
    "keybroker/testing",
    "maplit",
    "metrics/testing",
    "model/testing",
    "proptest",
    "roles/testing",
    "runtime/testing",
    "storage/testing",
    "usage_tracking/testing",
    "value/testing",
    "vector/testing",
    "udf/testing",
    "convex_macro/testing",
]
tracy-tracing = ["common/tracy-tracing"]

[dependencies]
ada-url = { workspace = true }
ai_gateway_jwt = { workspace = true }
anyhow = { workspace = true }
async-broadcast = { workspace = true }
async-recursion = { workspace = true }
async-trait = { workspace = true }
async_lru = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
cmd_util = { workspace = true }
common = { workspace = true }
convex_macro = { workspace = true }
database = { workspace = true }
deno_core = { workspace = true }
deno_core_icudata = { workspace = true }
derive_more = { workspace = true }
encoding_rs = { workspace = true }
errors = { workspace = true }
fastrace = { workspace = true }
file_storage = { workspace = true }
futures = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
humansize = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
keybroker = { workspace = true }
maplit = { workspace = true, optional = true }
metrics = { workspace = true }
mime = { workspace = true }
model = { workspace = true }
multer = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
paste = { workspace = true }
pb = { workspace = true }
phf = { workspace = true }
prometheus = { workspace = true }
proptest = { workspace = true, optional = true }
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
regex = { workspace = true }
roles = { workspace = true }
runtime = { workspace = true }
scopeguard = { workspace = true }
semver = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
slab = { workspace = true }
sourcemap = { workspace = true }
storage = { workspace = true }
strum = { workspace = true }
sync_types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
udf = { workspace = true }
url = { workspace = true }
usage_tracking = { workspace = true }
uuid = { workspace = true }
value = { workspace = true }
vector = { workspace = true }
wasmparser = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
webcrypto = { workspace = true }

[target."cfg(not(windows))".dependencies]
libc = { workspace = true }
# rust-native worker: dlopen of user cdylibs (WN-04). 0.7.4 is already in Cargo.lock.
libloading = "0.7"

[build-dependencies]
anyhow = { workspace = true }
js_build = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
async-broadcast = { workspace = true }
common = { workspace = true, features = ["testing"] }
convex_macro = { workspace = true, features = ["testing"] }
database = { workspace = true, features = ["testing"] }
divan = { workspace = true }
errors = { workspace = true, features = ["testing"] }
keybroker = { workspace = true, features = ["testing"] }
maplit = { workspace = true }
metrics = { workspace = true, features = ["testing"] }
model = { workspace = true, features = ["testing"] }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
roles = { workspace = true, features = ["testing"] }
runtime = { workspace = true, features = ["testing"] }
storage = { workspace = true, features = ["testing"] }
udf = { workspace = true, features = ["testing"] }
usage_tracking = { workspace = true, features = ["testing"] }
value = { workspace = true, features = ["testing"] }
vector = { workspace = true, features = ["testing"] }

[[bench]]
name = "new_context"
harness = false

[lints]
workspace = true
