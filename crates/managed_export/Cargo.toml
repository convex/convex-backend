[package]
name = "managed_export"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

[lib]
doctest = false

[features]
testing = [
    "common/testing",
    "dep:futures",
    "errors/testing",
    "iceberg-storage-opendal/opendal-memory",
    "keybroker/testing",
    "value/testing",
]

[dependencies]
anyhow = { workspace = true }
arrow_iceberg = { package = "arrow-array", version = "58" }
aws-credential-types = { workspace = true }
aws-sdk-glue = { version = "1.85", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-s3 = { workspace = true }
common = { workspace = true }
errors = { workspace = true }
fastrace = { workspace = true }
futures = { workspace = true, optional = true }
iceberg = "=0.10.1"
iceberg-storage-opendal = { version = "=0.10.1", default-features = false, features = ["opendal-s3"] }
keybroker = { workspace = true }
parquet_iceberg = { package = "parquet", version = "58", default-features = false }
pb = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
value = { workspace = true }

[dev-dependencies]
common = { workspace = true, features = ["testing"] }
errors = { workspace = true, features = ["testing"] }
futures = { workspace = true }
iceberg-storage-opendal = { version = "=0.10.1", default-features = false, features = ["opendal-memory"] }
keybroker = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
value = { workspace = true, features = ["testing"] }

[lints]
workspace = true
