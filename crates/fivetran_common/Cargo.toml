[package]
name = "fivetran_common"
description = "Common files for Fivetran connectors for Convex (convex.dev)"
version = "0.0.1"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
edition = "2024"
resolver = "2"
license = "Apache-2.0"
repository = "https://github.com/convex/convex-fivetran-source"
homepage = "https://www.convex.dev/"

[package.metadata.cargo-machete]
ignored = [
    # Build dependencies not understood
    "cfg-if",
    "fxhash",
    "tonic-prost-build",
    # Prost required via tonic macro
    "prost",
    "tonic-prost",
]

[lib]
name = "fivetran_common"
path = "src/lib.rs"

[features]
testing = ["proptest"]

[dependencies]
anyhow = { workspace = true }
proptest = { workspace = true, optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
url = { workspace = true }

[build-dependencies]
cfg-if = { workspace = true }
fxhash = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
maplit = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
