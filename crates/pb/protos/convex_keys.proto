syntax = "proto3";

package convex_keys;

import "google/protobuf/empty.proto";

message AdminKey {
  optional string instance_name = 1;
  // Time of issue, measured in seconds since the epoch.
  uint64 issued_s = 2;
  oneof identity {
    uint64 member_id = 3;
    google.protobuf.Empty system = 4;
  }
  bool is_read_only = 5;
}

message StorageToken {
  message StoreFile {}

  string instance_name = 1;
  uint64 issued_s = 2;
  oneof authorization_type {
    StoreFile store_file = 3;
  }
  optional string component_id = 4;
}

message ExportDownloadToken {
  // Time of issue, measured in seconds since the epoch.
  uint64 issued_s = 1;
  // The snapshot identifier (export document ID or snapshot timestamp) that
  // this token authorizes downloading.
  string snapshot_id = 2;
  // The actor that requested the download, recorded so each download can be
  // attributed (e.g. for audit logging): the member and/or the access token
  // that authenticated the request. Both unset for system actors.
  optional uint64 member_id = 3;
  optional uint64 token_id = 4;
}
