[package]
name = "convex_sync_types"
description = "Sync types for the Convex Websocket protocol (convex.dev)"
version = "0.10.4"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
edition = "2021"
rust-version = "1.85"
resolver = "2"
license = "Apache-2.0"
repository = "https://github.com/convex/convex-rs"
homepage = "https://www.convex.dev/"

[features]
testing = ["proptest", "proptest-derive", "pretty_assertions"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
derive_more = { workspace = true }
headers = { workspace = true }
pretty_assertions = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [
    "float_roundtrip",
    "preserve_order",
    "raw_value",
] }
strum = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
proptest = { workspace = true }
proptest-derive = { workspace = true }

[lints]
workspace = true
