[package]
name = "convex"
description = "Client library for Convex (convex.dev)"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
version = "0.10.4"
edition = "2021"
rust-version = "1.85"
resolver = "2"
license = "Apache-2.0"
repository = "https://github.com/convex/convex-rs"
homepage = "https://www.convex.dev/"

[package.metadata.cargo-machete]
ignored = ["tokio-native-tls"]

# The non-rustls features are quarantined to the OSS release to avoid
# accidentally including native-tls features into the main monorepo
[package.metadata.oss-features]
default = ["native-tls-vendored"]
native-tls = ["tokio-tungstenite/native-tls"]
native-tls-vendored = ["tokio-tungstenite/native-tls-vendored"]
rustls-tls-webpki-roots = ["tokio-tungstenite/rustls-tls-webpki-roots"]

[features]
default = ["rustls-tls-native-roots"]
rustls-tls-native-roots = ["tokio-tungstenite/rustls-tls-native-roots"]
testing = ["convex_sync_types/testing", "proptest", "proptest-derive", "parking_lot"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
convex_sync_types = { path = "./sync_types", version = "=0.10.4" }
futures = { workspace = true }
imbl = { workspace = true }
parking_lot = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
rand = { workspace = true }
serde_json = { workspace = true, features = [
    "float_roundtrip",
    "preserve_order",
    "raw_value",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["io-util", "sync"] }
tokio-tungstenite = { workspace = true, features = ["url"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
colored = { workspace = true }
convex_sync_types = { path = "./sync_types", version = "=0.10.4", features = [
    "testing",
] }
dotenvy = { workspace = true }
maplit = { workspace = true }
parking_lot = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
proptest-derive = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# HAX: This is here to force `tokio-native-tls` into the root Cargo.lock file so
# that `generate_oss_cargo_tomls.py` can generate Cargo.oss.lock without
# consulting the registry; that script also strips out this section
[target."cfg(any())".dev-dependencies]
tokio-native-tls = { version = "0.3", features = ["vendored"] }

[lints]
workspace = true
