[build]
  ignore = "bash npm-packages/docs/scripts/should-build.sh"
  # Runs from the repo root. The docs build reads other workspace packages only as checked-in
  # source: `convex/src` (TypeDoc) and `@convex-dev/platform/*-openapi.json`.
  command = """
    cd scripts \
    && npm ci \
    && cd ../npm-packages/docs \
    && export PATH="$PWD/../../scripts/node_modules/.bin:$PATH" \
    && pnpm --filter 'docs...' install --frozen-lockfile \
    && npm run build
  """

[build.environment]
  # Netlify's init phase runs the image's preinstalled mise from the repo root. The docs
  # build needs none of mise.toml's tools, and ignoring it keeps init from failing when
  # mise.toml's min_version is newer than the image's mise.
  MISE_IGNORED_CONFIG_PATHS = "/opt/build/repo/mise.toml"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
