autoInstallPeers: true
publishBranch: release
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # First-party package, thus the delay protects nothing here.
  - convex-helpers
  # AI SDK's experimental evaluation interface for Jev.
  - ai@7.0.105
  - "@ai-sdk/gateway@4.0.85"
  - "@ai-sdk/provider@4.0.17"
  - "@ai-sdk/provider-utils@5.0.43"
  - next@16.4.2
  - "@next/env@16.4.2"
  - "@next/swc-darwin-arm64@16.4.2"
  - "@next/swc-darwin-x64@16.4.2"
  - "@next/swc-linux-arm64-gnu@16.4.2"
  - "@next/swc-linux-arm64-musl@16.4.2"
  - "@next/swc-linux-x64-gnu@16.4.2"
  - "@next/swc-linux-x64-musl@16.4.2"
  - "@next/swc-win32-arm64-msvc@16.4.2"
  - "@next/swc-win32-x64-msvc@16.4.2"
  - next@15.5.27
  - "@next/env@15.5.27"
  - "@next/swc-darwin-arm64@15.5.27"
  - "@next/swc-darwin-x64@15.5.27"
  - "@next/swc-linux-arm64-gnu@15.5.27"
  - "@next/swc-linux-arm64-musl@15.5.27"
  - "@next/swc-linux-x64-gnu@15.5.27"
  - "@next/swc-linux-x64-musl@15.5.27"
  - "@next/swc-win32-arm64-msvc@15.5.27"
  - "@next/swc-win32-x64-msvc@15.5.27"
  # First-party publishes; satellite packages pin `convex@^<latest>` right
  # after a release, which would otherwise fail the age gate whenever anything
  # re-resolves (e.g. `pnpm deploy`) during the 7 days after a convex release.
  - convex
  # First-party analytics package; docs pins an exact version right after
  # npm publish, which would otherwise fail the 7-day age gate on install.
  - "@convex-internal/web-analytics"
  # The brace-expansion overrides below pin the DoS fixes, which are newer than
  # the age gate on every maintenance branch.
  - brace-expansion
  # Renovate security update: svgo@4.1.0
  - svgo@4.1.0
  - adm-zip@0.6.1
  # First-party publish; the convex-test docs often reference new features
  - convex-test
  - "@convex-dev/workpool@0.4.14"
  # First-party publish; the CLI can't use workspace:* because copy.bara.sky
  # mirrors it to convex-js.
  - "@convex-dev/platform"

# Keep react and react-dom out of pnpm's hoisted fallback layer. The workspace
# has both React 18 (the demos) and React 19 (the dashboards), and
# node_modules/.pnpm/node_modules holds a single global copy of each package:
# whichever major an install puts there wins for every package that resolves
# react without declaring a dependency on it, including Next's server-side
# require() during prerendering. pnpm never reconciles that slot on later
# installs, so a node_modules tree carried across the React 18 -> 19 upgrade
# keeps serving React 18 and mixes the two majors at build time.
hoistPattern:
  - "*"
  - "!react"
  - "!react-dom"

# These packages' .d.ts files import "react" without declaring @types/react,
# so tsc resolves whichever @types/react pnpm happened to hoist into
# node_modules/.pnpm/node_modules — a single global winner. With both React 18
# and 19 in the workspace, that breaks type checking for whichever side loses.
# Declaring @types/react as an optional peer links the consumer's own types
# version next to each package instance instead.
packageExtensions:
  # These /test entrypoints need the consuming app's convex-test types.
  "@convex-dev/workpool@0.4.14":
    peerDependencies:
      convex-test: "^0.0.61"
    peerDependenciesMeta:
      convex-test:
        optional: true
  "@convex-dev/batch-worker@0.2.2":
    peerDependencies:
      convex-test: "*"
    peerDependenciesMeta:
      convex-test:
        optional: true
  "@headlessui/react":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@heroicons/react":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@radix-ui/react-icons":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  react-use:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
  next:
    peerDependencies:
      "@types/react": "*"
      "@types/react-dom": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@types/react-dom":
        optional: true
  "@tanstack/react-router":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "@tanstack/react-start":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # posthog-js/react require()s "react" but posthog-js declares no react
  # dependency at all, so it only ever resolved through the hoisted fallback.
  # Declaring react as an optional peer links the consumer's own React next to
  # each posthog-js instance instead.
  posthog-js:
    peerDependencies:
      react: "*"
    peerDependenciesMeta:
      react:
        optional: true

